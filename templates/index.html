<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WaterLVL</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>WaterLVL</h1>
    <div class="controls">
      <button id="pollBtn">&#8635;</button>
    </div>
  </header>

  <main>
    <section class="tanks" id="tanks"></section>
    <p id="lastUpdated" class="last-updated"></p>
  </main>

  <script>
    function fmt(val) { return val == null ? "-" : Number(val).toFixed(1); }

    function getColor(pct) {
      if (pct >= 60) return "#10b981";
      if (pct >= 30) return "#f59e0b";
      return "#ef4444";
    }

    function isStuck(deviceRows) {
      if (deviceRows.length < 2) return false;
      const min = Math.min(...deviceRows.map(r => r.value));
      const max = Math.max(...deviceRows.map(r => r.value));
      return (max - min) <= 1;
    }

    async function load() {
      const [devRes, rowRes] = await Promise.all([
        fetch("/api/devices"),
        fetch("/api/readings?range=24h")
      ]);
      const devices = await devRes.json();
      const rows = await rowRes.json();

      const latest = {};
      const byDevice = {};
      rows.forEach(r => {
        if (!latest[r.device_id] || r.ts > latest[r.device_id].ts) latest[r.device_id] = r;
        if (!byDevice[r.device_id]) byDevice[r.device_id] = [];
        byDevice[r.device_id].push(r);
      });

      const el = document.getElementById("tanks");
      el.innerHTML = "";
      devices.forEach(d => {
        const l = latest[d.device_id];
        const pct = l ? Math.min(100, Math.max(0, l.value)) : 0;
        const color = getColor(pct);
        const ts = l ? new Date(l.ts * 1000).toLocaleString() : "No data";
        const stuck = isStuck(byDevice[d.device_id] || []);
        const warning = stuck
          ? `<div class="tank-warning">&#9888; Check tank visually</div>`
          : "";
        el.innerHTML += `
          <a class="tank-card${stuck ? " tank-card--warn" : ""}" href="/tank/${d.device_id}">
            <div class="tank-name">${d.name}</div>
            <div class="tank-wrap">
              <div class="tank-body">
                <div class="tank-water" style="height:${pct}%;background:${color};">
                  <div class="tank-ripple"></div>
                </div>
                <div class="tank-pct">${fmt(pct)}<span class="tank-unit">%</span></div>
              </div>
              <div class="tank-scale">
                <span>100%</span><span>75%</span><span>50%</span><span>25%</span><span>0%</span>
              </div>
            </div>
            <div class="tank-ts">${ts}</div>
            ${warning}
          </a>`;
      });

      document.getElementById("lastUpdated").textContent = "Updated " + new Date().toLocaleTimeString();
    }

    document.getElementById("pollBtn").addEventListener("click", async () => {
      const btn = document.getElementById("pollBtn");
      btn.disabled = true;
      await fetch("/api/poll", { method: "POST" });
      await load();
      btn.disabled = false;
    });

    load();
    setInterval(load, 60 * 60 * 1000);
  </script>
</body>
</html>
